name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships the Android SDK. The old setup-android
      # action is broken on current images (it tries to install the removed
      # "tools" package), so use sdkmanager directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" | head
          find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar 2>/dev/null | sort -V | tail -5

      - name: Cache JRE pack
        uses: actions/cache@v4
        with:
          path: |
            /tmp/pojav.apk
            /tmp/jdk8.tar.gz
          key: pojav-jre8-gladiolus-jdk8-v1

      - name: Prepare bundled JRE 8
        run: |
          set -euo pipefail

          if [ ! -s /tmp/pojav.apk ]; then
            curl -fL --retry 3 -o /tmp/pojav.apk \
              https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          fi
          if [ ! -s /tmp/jdk8.tar.gz ]; then
            curl -fL --retry 3 -o /tmp/jdk8.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/8/ga/linux/x64/jdk/hotspot/normal/eclipse"
          fi

          rm -rf /tmp/pojav-extract /tmp/jre8 /tmp/bridge-classes /tmp/jdk8
          mkdir -p /tmp/pojav-extract /tmp/jre8 /tmp/bridge-classes /tmp/jdk8 \
            android/app/src/main/assets
          unzip -q /tmp/pojav.apk 'assets/components/jre/*' -d /tmp/pojav-extract
          tar -xJf /tmp/pojav-extract/assets/components/jre/universal.tar.xz -C /tmp/jre8
          tar -xJf /tmp/pojav-extract/assets/components/jre/bin-arm64.tar.xz -C /tmp/jre8

          # JRE8 ships compressed .pack files. Unpack them with a host JDK 8
          # tool; Android cannot execute binaries from app storage.
          tar -xzf /tmp/jdk8.tar.gz -C /tmp/jdk8 --strip-components=1
          UNPACK200=$(find /tmp/jdk8 -name unpack200 -type f | head -1)
          echo "using $UNPACK200"
          find /tmp/jre8 -name '*.pack' -print0 | while IFS= read -r -d '' pack; do
            "$UNPACK200" "$pack" "${pack%.pack}"
            rm -f "$pack"
          done

          # The pack contains one relative symlink; replace it with the real
          # file so the on-device unzip can stay simple.
          rm /tmp/jre8/lib/aarch64/server/libjsig.so
          cp /tmp/jre8/lib/aarch64/libjsig.so /tmp/jre8/lib/aarch64/server/libjsig.so

          rm -f android/app/src/main/assets/jre8.zip
          (cd /tmp/jre8 && zip -qry "$GITHUB_WORKSPACE/android/app/src/main/assets/jre8.zip" .)

          javac -source 8 -target 8 -encoding UTF-8 \
            -d /tmp/bridge-classes \
            android/bridge/src/rustcraft/BridgeTest.java
          rm -f android/app/src/main/assets/bridge.jar
          jar cf android/app/src/main/assets/bridge.jar -C /tmp/bridge-classes .

          ls -lh android/app/src/main/assets

      - name: Build Rust library
        run: |
          JAR=$(find "$ANDROID_HOME/platforms" -name android.jar 2>/dev/null | sort -V | tail -1)
          test -f "$JAR"
          echo "Using android.jar: $JAR"
          ANDROID_JAR="$JAR" cargo ndk -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build -p rustcraft-ui --release \
            --no-default-features --features android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustcraft-preview-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
