name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-preview.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust library
        run: |
          cargo ndk -t arm64-v8a \
            -o android/app/src/main/jniLibs \
            build -p rustcraft-ui --release \
            --no-default-features --features android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustcraft-preview-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
