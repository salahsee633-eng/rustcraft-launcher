[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"      # size matters on phones (smaller .so, faster cold start)
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
